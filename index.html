<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#141220"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Viaje"><title>Planificador de vacaciones</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Fraunces:wght@600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#141220;--card:#1f1b30;--c2:#2a2540;--tx:#f4ece3;--mu:#a79fb8;--ac:#ff9e6b;--ok:#6fd6a5;--bd:#38314f;--w:#ffd27a;--o:#ff8a4c;--r:#ff6b7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Figtree,system-ui,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:14px 16px;flex-wrap:wrap;background:linear-gradient(110deg,#3a2a5c,#9c4a5a 65%,#e98a62)}
header h1{font:600 24px Fraunces,Georgia,serif;margin:0;flex:1;min-width:150px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
nav button{white-space:nowrap;background:none;border:0;color:var(--mu);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--c2);color:var(--ac);font-weight:600}
main{padding:16px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}
h3{margin:0 0 8px;font:600 18px Fraunces,Georgia,serif}h3 small{color:var(--mu);font-weight:400}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.wide{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.k{background:var(--c2);border-radius:10px;padding:10px}.k span{color:var(--mu);font-size:12px}.k b{display:block;font-size:18px}
.bar{height:8px;background:var(--c2);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%}
.mu{color:var(--mu)}.r{color:var(--r)}.pad{padding:20px}
.btn{background:var(--c2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
.btn.p{background:var(--ac);color:#2a1208;border:0;font-weight:600}.btn.d{color:var(--r)}.btn.s{padding:3px 8px;font-size:12px}
input,select,textarea{background:var(--c2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;font:inherit;width:100%}
input[type=checkbox]{width:auto}input:disabled{opacity:.4}
label{display:block;font-size:12px;color:var(--mu)}.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.f .full{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>.g{flex:1}
.b{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--c2)}
.b.pendiente{color:var(--w)}.b.reservado{color:#7c9cff}.b.pagado{color:var(--ok)}.b.cancelado{color:var(--mu);text-decoration:line-through}
.chip{border-left:4px solid;background:var(--c2);border-radius:6px;padding:4px 6px;margin-top:5px;font-size:12px;cursor:pointer}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.day{border:1px solid var(--bd);border-radius:10px;padding:8px;min-height:110px}.day h4{margin:0;cursor:pointer;font-size:13px}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:right;border-bottom:1px solid var(--bd)}td:first-child,th:first-child{text-align:left}
.al{padding:8px 12px;border-radius:8px;margin-bottom:10px;font-weight:600}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;width:94%;max-width:600px;padding:18px}
dialog::backdrop{background:#000a}
#map{height:60vh;border-radius:12px;z-index:1}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ac);color:#2a1208;padding:8px 16px;border-radius:8px;display:none;z-index:99;font-weight:600}
@media(max-width:700px){nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--bd);border-bottom:0;z-index:20}main{padding-bottom:84px}}
#print{display:none}
@media print{body{background:#fff}body>*:not(#print){display:none!important}#print{display:block;color:#000;font:13px sans-serif}#print h2{margin:14px 0 4px}#print p{margin:2px 0}}
</style></head><body>
<header><h1 id="ttl">Planificador de vacaciones</h1><input id="q" type="search" placeholder="Buscar actividades…" style="max-width:240px" oninput="U.f.q=this.value;go('act')"><button class="btn p" onclick="openAct()">+ Actividad</button></header>
<nav id="nav"></nav><main id="main"></main><dialog id="dlg"></dialog><div id="toast"></div><div id="print"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CATS={turismo:['Turismo','#4cc9b0'],tour:['Tour','#7c9cff'],alojamiento:['Alojamiento','#c78bff'],transporte:['Transporte','#f5b942'],alimentacion:['Alimentación','#ff8a4c'],compras:['Compras','#ff6fa8'],otros:['Otros','#8f9bb2']};
const STS={pendiente:'Pendiente',reservado:'Reservado',pagado:'Pagado',cancelado:'Cancelado'};
const TC=['Documentación','Reservas','Equipaje','Seguros','Dinero','Transporte','Otros'];
const TABS={dash:'Resumen',cal:'Calendario',act:'¿Qué haremos?',stg:'Etapas',bud:'Presupuesto',map:'Mapa',dia:'Gastos diarios',sh:'Compartidos',prep:'Preparativos',data:'Datos'};
const WN={kpi:'Resumen del viaje',budget:'Presupuesto',next:'Próximas actividades',alerts:'Pendientes',daily:'Gastos diarios'};
const KEY='planVacaciones.v1';
const def=()=>({trip:{name:'',dest:'',start:'',end:'',cur:'CLP',budget:0,limit:0},acts:[],extras:[],tasks:[],stages:[],wish:[],rates:{},settled:[],partner:'',dash:{order:Object.keys(WN),hide:[]}});
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d?Object.assign(def(),d):def()}catch(e){return def()}}
let S=load(),U={tab:'dash',day:null,cal:'grid',custom:false,route:false,f:{q:'',date:'',cat:'',st:''}};
let DB=null,DBH=null,sT,last='';
function save(){const j=JSON.stringify(S);if(j===last)return;last=j;try{localStorage.setItem(KEY,j)}catch(e){}if(DB){clearTimeout(sT);sT=setTimeout(()=>DB.set({json:j}).catch(()=>toast('No se pudo sincronizar con Claude')),500)}}
async function initDB(){try{if(!window.claude||!claude.use)return;const db=await Promise.race([claude.use('db'),new Promise(r=>setTimeout(r,10000))]);if(!db)return;const ref=db.doc('trip/main'),s=await ref.get();DB=ref;DBH=db;if(s.exists&&s.data().json){S=Object.assign(def(),JSON.parse(s.data().json));last=s.data().json;U.day=null;render()}else{last='';save()}}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T00:00');
const isD=s=>/^\d{4}-\d\d-\d\d$/.test(s||'')&&!isNaN(pd(s));
const fmt=n=>{try{return new Intl.NumberFormat('es-CL',{style:'currency',currency:S.trip.cur,maximumFractionDigits:S.trip.cur==='CLP'?0:2}).format(n||0)}catch(e){return(n||0)+' '+S.trip.cur}};
const dl=d=>!d?'Sin fecha':pd(d).toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short'});
const days=()=>{const t=S.trip,r=[];if(!isD(t.start)||!isD(t.end))return r;for(let d=pd(t.start);d<=pd(t.end);d.setDate(d.getDate()+1))r.push(iso(d));return r};
const byT=(a,b)=>(a.sd+(a.st||'')).localeCompare(b.sd+(b.st||''));
const dur=a=>{const m=(new Date(a.ed+'T'+(a.et||'00:00'))-new Date(a.sd+'T'+(a.st||'00:00')))/6e4;if(!(m>0))return'—';const d=Math.floor(m/1440),h=Math.floor(m%1440/60),i=Math.round(m%60);return[d&&d+' d',h&&h+' h',i&&i+' min'].filter(Boolean).join(' ')};
const cost=a=>a.status==='cancelado'?{p:0,n:0}:a.status==='pagado'?{p:+a.paid||0,n:0}:{p:0,n:+a.est||0};
const badge=s=>`<span class="b ${s}">${STS[s]}</span>`;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
function totals(){let paid=0,pend=0,cat={};S.acts.forEach(a=>{const c=cost(a);paid+=c.p;pend+=c.n;cat[a.cat]=(cat[a.cat]||0)+c.p+c.n});S.extras.forEach(e=>{paid+=+e.amt;cat[e.cat||'otros']=(cat[e.cat||'otros']||0)+ +e.amt});
 const b=+S.trip.budget||0,comm=paid+pend;return{paid,pend,comm,cat,b,avail:b-comm,pct:b>0?comm/b*100:0}}
function dayS(d){let paid=0,pend=0,n=0;S.acts.filter(a=>a.sd===d).forEach(a=>{const c=cost(a);paid+=c.p;pend+=c.n;if(a.status!=='cancelado')n++});S.extras.filter(e=>e.date===d).forEach(e=>paid+=+e.amt);return{paid,pend,comm:paid+pend,n}}
const lvl=p=>p>=100?['Presupuesto superado','var(--r)']:p>=90?['Más del 90% del presupuesto comprometido','var(--o)']:p>=75?['Más del 75% del presupuesto comprometido','var(--w)']:null;
const bar=p=>`<div class="bar"><i style="width:${Math.min(p,100)}%;background:${p>=100?'var(--r)':p>=90?'var(--o)':p>=75?'var(--w)':'var(--ac)'}"></i></div>`;
const alertB=p=>{const l=lvl(p);return l?`<div class="al" style="background:${l[1]};color:#111">${l[0]} (${p.toFixed(0)}%)</div>`:''};
/* gráficos */
function donut(m){const it=Object.entries(m).filter(e=>e[1]>0),t=it.reduce((s,e)=>s+e[1],0);if(!t)return'<p class="mu">Sin gastos registrados.</p>';let off=25;
 const c=it.map(([k,v])=>{const p=v/t*100,s=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${CATS[k][1]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p;return s}).join('');
 return`<div class="row"><svg viewBox="0 0 42 42" width="140" height="140">${c}</svg><div class="g">${it.map(([k,v])=>`<div><span class="dot" style="display:inline-block;background:${CATS[k][1]}"></span> ${CATS[k][0]}: ${fmt(v)} (${(v/t*100).toFixed(0)}%)</div>`).join('')}</div></div>`}
function bars(lab,a,b,lim){const W=Math.max(300,lab.length*34),H=150,base=H-20,mx=Math.max(...a,...b,lim||0,1),y=v=>base-v/mx*(H-30);
 return`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="min-width:${W}px;width:100%">${lab.map((l,i)=>`<rect x="${i*34+4}" y="${y(a[i])}" width="12" height="${base-y(a[i])}" fill="#ff9e6b55"/><rect x="${i*34+17}" y="${y(b[i])}" width="12" height="${base-y(b[i])}" fill="#ff9e6b"/><text x="${i*34+17}" y="${H-5}" fill="#8f9bb2" font-size="10" text-anchor="middle">${l}</text>`).join('')}${lim>0?`<line x1="0" x2="${W}" y1="${y(lim)}" y2="${y(lim)}" stroke="#ff5d6c" stroke-dasharray="4"/>`:''}</svg></div><small class="mu">Claro: comprometido · Intenso: pagado${lim>0?' · Línea roja: límite diario':''}</small>`}
const dailyChart=()=>{const D=days();return bars(D.map((d,i)=>i+1),D.map(d=>dayS(d).comm),D.map(d=>dayS(d).paid),+S.trip.limit)};
/* widgets */
const kp=(l,v,c='')=>`<div class="k"><span>${l}</span><b class="${c}">${v}</b></div>`;
const W={
kpi(){const t=S.trip,T=totals();return`<div class="card wide"><h3>${esc(t.name||'Mi viaje')} <small>${esc(t.dest)}</small></h3><div class="mu">${dl(t.start)} a ${dl(t.end)} · ${days().length} días</div><div class="kpis">${kp('Presupuesto',fmt(T.b))}${kp('Planificado (pagado + pendiente)',fmt(T.comm))}${kp('Pagado',fmt(T.paid))}${kp('Disponible',fmt(T.avail),T.avail<0?'r':'')}</div>${alertB(T.pct)}${bar(T.pct)}<small class="mu">${T.pct.toFixed(0)}% del presupuesto utilizado</small></div>`},
budget(){const T=totals();return`<div class="card"><h3>Gasto por categoría</h3>${donut(T.cat)}</div>`},
next(){const n=iso(new Date())+'T'+new Date().toTimeString().slice(0,5),L=S.acts.filter(a=>a.status!=='cancelado'&&a.sd+'T'+(a.st||'00:00')>=n).sort(byT).slice(0,5);return`<div class="card"><h3>Próximas actividades</h3>${L.length?L.map(a=>`<div class="it" onclick="openDet('${a.id}')" style="cursor:pointer"><span class="dot" style="background:${CATS[a.cat][1]}"></span><div class="g" style="flex:1"><b>${esc(a.name)}</b><div class="mu">${dl(a.sd)} ${a.st||''}</div></div>${badge(a.status)}</div>`).join(''):'<p class="mu">No hay actividades próximas.</p>'}</div>`},
alerts(){const L=pend();return`<div class="card"><h3>Pendientes</h3>${L.length?L.slice(0,8).map(x=>`<div class="it" ${x.id?`onclick="openDet('${x.id}')" style="cursor:pointer"`:''}><div class="g" style="flex:1">${esc(x.t)}<div class="mu">${x.d?dl(x.d):'Sin fecha'}</div></div>${x.late?'<span class="b r">Vencido</span>':''}</div>`).join(''):'<p class="mu">Sin reservas, pagos ni tareas por atender.</p>'}</div>`},
daily(){return`<div class="card"><h3>Gastos diarios</h3>${dailyChart()}</div>`}};
function pend(){const td=iso(new Date()),L=[];S.acts.filter(a=>a.status==='pendiente'||a.status==='reservado').sort(byT).forEach(a=>L.push({id:a.id,d:a.sd,late:!!a.sd&&a.sd<td,t:(a.status==='pendiente'?'Por reservar: ':'Pago pendiente: ')+a.name+' ('+fmt(a.est)+')'}));
 const lim=new Date();lim.setDate(lim.getDate()+7);S.tasks.filter(t=>!t.done&&t.due&&t.due<=iso(lim)).forEach(t=>L.push({d:t.due,late:t.due<td,t:'Tarea: '+t.t}));return L}
/* vistas */
const V={
dash(){if(!isD(S.trip.start))return empty();const o=S.dash.order.filter(k=>W[k]&&!S.dash.hide.includes(k));
 const ctl=k=>U.custom?`<div class="row" style="margin:4px 0"><b class="g mu">${WN[k]}</b><button class="btn s" onclick="mv('${k}',-1)">▲</button><button class="btn s" onclick="mv('${k}',1)">▼</button><button class="btn s d" onclick="hideW('${k}')">Ocultar</button></div>`:'';
 return`<div class="row" style="margin-bottom:12px"><span class="g"></span><button class="btn" onclick="U.custom=!U.custom;render()">${U.custom?'Terminar personalización':'Personalizar panel'}</button></div><div class="grid">${o.map(k=>k==='kpi'||U.custom?`<div class="${k==='kpi'?'wide':''}">${ctl(k)}${W[k]().replace('card wide','card')}</div>`:W[k]()).join('')}</div>${U.custom&&S.dash.hide.length?`<p>Ocultos: ${S.dash.hide.map(k=>`<button class="btn s" onclick="showW('${k}')">+ ${WN[k]}</button>`).join(' ')}</p>`:''}`},
cal(){if(!isD(S.trip.start))return empty();const D=days();if(!U.day||!D.includes(U.day))U.day=D.includes(iso(new Date()))?iso(new Date()):D[0];
 const tog=`<div class="row" style="margin-bottom:12px"><button class="btn ${U.cal==='grid'?'p':''}" onclick="U.cal='grid';render()">Calendario</button><button class="btn ${U.cal==='ag'?'p':''}" onclick="U.cal='ag';render()">Agenda diaria</button><button class="btn" onclick="loadWx();toast('Actualizando clima…')">Actualizar clima</button></div>`;
 if(U.cal==='ag'){const i=D.indexOf(U.day),L=S.acts.filter(a=>a.sd===U.day).sort(byT),X=S.extras.filter(e=>e.date===U.day),s=dayS(U.day);
  return tog+`<div class="card"><div class="row"><button class="btn" ${i?'':'disabled'} onclick="U.day='${D[i-1]}';render()">←</button><select class="g" onchange="U.day=this.value;render()">${D.map((d,j)=>`<option value="${d}" ${d===U.day?'selected':''}>Día ${j+1} · ${dl(d)}</option>`).join('')}</select><button class="btn" ${i<D.length-1?'':'disabled'} onclick="U.day='${D[i+1]}';render()">→</button><button class="btn p" onclick="openAct(null,'${U.day}')">+ Actividad</button></div>
  <p class="mu">Planificado ${fmt(s.comm)} · Pagado ${fmt(s.paid)}</p>${wxs(U.day)?`<p>${wxs(U.day)}</p>`:''}${L.length?L.map((a,i)=>(i?leg(L[i-1],a):'')+row(a)).join(''):'<p class="mu">Sin actividades este día.</p>'}${X.map(e=>`<div class="it"><span class="dot" style="background:#8f9bb2"></span><div style="flex:1">Gasto extra: ${esc(e.desc)}</div><b>${fmt(e.amt)}</b></div>`).join('')}</div>`}
 const mx=Math.max(...D.map(d=>dayS(d).n));
 return tog+`<div class="days">${D.map((d,i)=>{const L=S.acts.filter(a=>a.sd===d&&a.status!=='cancelado').sort(byT),n=L.length;return`<div class="day" ondragover="event.preventDefault()" ondrop="dropA(event,'${d}')" style="background:rgba(255,158,107,${n?Math.min(.07+n*.06,.4):0})"><h4 onclick="U.day='${d}';U.cal='ag';render()">Día ${i+1} · ${dl(d)}</h4><div>${wxs(d)}</div><small class="mu">${stOf(d)?esc(stOf(d).city)+' · ':''}${n} act.${n&&n===mx&&mx>1?' · más cargado':''}</small>${L.map(a=>`<div class="chip" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${a.id}')" style="border-color:${CATS[a.cat][1]}" onclick="openDet('${a.id}')">${a.st||''} <b>${esc(a.name)}</b><br>${CATS[a.cat][0]} · ${fmt(a.est)}</div>`).join('')}</div>`}).join('')}</div><div class="card" style="margin-top:12px" ondragover="event.preventDefault()" ondrop="dropA(event,'')"><h3>Ideas por definir</h3>${S.acts.filter(a=>!a.sd).map(a=>`<div class="chip" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${a.id}')" style="border-color:${CATS[a.cat][1]}" onclick="openDet('${a.id}')"><b>${esc(a.name)}</b> · ${CATS[a.cat][0]} · ${fmt(a.est)}</div>`).join('')||'<p class="mu">Sin ideas pendientes de asignar.</p>'}<small class="mu">Arrastra una actividad sobre un día para asignarla, o aquí para dejarla sin fecha. En el celular usa «Mover a…» en el detalle. Toca el título de un día para abrir su agenda.</small></div>`},
act(){const f=U.f;return`<div class="card"><div class="f"><div><label>Fecha</label><select onchange="U.f.date=this.value;render()"><option value="">Todas</option>${days().map(d=>`<option ${d===f.date?'selected':''} value="${d}">${dl(d)}</option>`).join('')}</select></div><div><label>Categoría</label><select onchange="U.f.cat=this.value;render()"><option value="">Todas</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===f.cat?'selected':''}>${v[0]}</option>`).join('')}</select></div><div><label>Estado</label><select onchange="U.f.st=this.value;render()"><option value="">Todos</option>${Object.entries(STS).map(([k,v])=>`<option value="${k}" ${k===f.st?'selected':''}>${v}</option>`).join('')}</select></div></div>
 <div class="row" style="margin:10px 0"><span class="g mu">${f.q?'Búsqueda: «'+esc(f.q)+'» ':''}</span><button class="btn s" onclick="U.f={q:'',date:'',cat:'',st:''};$('#q').value='';render()">Limpiar filtros</button></div>${(()=>{const q=f.q.toLowerCase(),L=S.acts.filter(a=>(!f.date||a.sd===f.date)&&(!f.cat||a.cat===f.cat)&&(!f.st||a.status===f.st)&&(!q||[a.name,a.loc,a.notes].join(' ').toLowerCase().includes(q))).sort(byT);return L.length?L.map(row).join(''):'<p class="mu">No hay actividades con estos filtros. Usa «+ Actividad» para agregar.</p>'})()}</div>`},
bud(){const T=totals(),t=S.trip;return`<div class="card"><div class="f"><div><label>Presupuesto total</label><input type="number" min="0" value="${t.budget}" onchange="setT('budget',this.value)"></div><div><label>Moneda</label><select onchange="setT('cur',this.value)">${['CLP','USD','EUR','ARS','BRL','PEN','MXN','BOB'].map(c=>`<option ${c===t.cur?'selected':''}>${c}</option>`).join('')}</select></div></div><small class="mu">Cambiar la moneda no convierte montos, solo el símbolo.</small></div><br>${alertB(T.pct)}
 <div class="kpis">${kp('Presupuesto',fmt(T.b))}${kp('Planificado total',fmt(T.comm))}${kp('Pagado',fmt(T.paid))}${kp('Pendiente',fmt(T.pend))}${kp('Disponible',fmt(T.avail),T.avail<0?'r':'')}</div>

 <div class="card wide"><h3>Detalle por categoría</h3><table><tr><th>Categoría</th><th>Pagado</th><th>Pendiente</th><th>Total</th></tr>${Object.entries(CATS).map(([k,v])=>{let p=0,n=0;S.acts.filter(a=>a.cat===k).forEach(a=>{const c=cost(a);p+=c.p;n+=c.n});if(k==='otros')S.extras.forEach(e=>p+=+e.amt);return`<tr><td>${v[0]}</td><td>${fmt(p)}</td><td>${fmt(n)}</td><td>${fmt(p+n)}</td></tr>`}).join('')}</table></div></div>`},

dia(){if(!isD(S.trip.start))return empty();const D=days(),L=+S.trip.limit;
 return`<div class="card"><label>Límite de gasto diario</label><input type="number" min="0" value="${L}" onchange="setT('limit',this.value)"></div><br><div class="card"><h3>Evolución</h3>${dailyChart()}</div><br><div class="card" style="overflow-x:auto"><table><tr><th>Día</th><th>Planificado</th><th>Pagado</th><th>Real vs límite</th><th>Estado</th></tr>${D.map((d,i)=>{const s=dayS(d),ov=L>0&&s.comm>L;return`<tr><td>${i+1} · ${dl(d)}</td><td>${fmt(s.comm)}</td><td>${fmt(s.paid)}</td><td>${L?(s.paid/L*100).toFixed(0)+'%':'—'}</td><td class="${ov?'r':''}">${!L?'Sin límite':ov?'Excede el límite':'Dentro del límite'}</td></tr>`}).join('')}</table></div><br>
 <div class="card"><h3>Gastos adicionales (fuera del itinerario)</h3><form onsubmit="return addX(event)" class="f"><div><label>Fecha</label><select name="date">${D.map(d=>`<option value="${d}">${dl(d)}</option>`).join('')}</select></div><div><label>Descripción</label><input name="desc" required></div><div><label>Monto</label><input name="amt" type="number" min="1" step="any" required></div><div><label>Moneda</label><select name="cur">${[S.trip.cur,...CUR.filter(c=>c!==S.trip.cur)].map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Categoría</label><select name="cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k==='otros'?'selected':''}>${v[0]}</option>`).join('')}</select></div><div style="align-self:end"><button class="btn p">Agregar gasto</button></div></form>
 ${S.extras.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="it"><div style="flex:1">${dl(e.date)} · ${esc(e.desc)} <span class="mu">(${CATS[e.cat||'otros'][0]})</span></div><b>${fmt(e.amt)}</b><button class="btn s d" onclick="delX('${e.id}')">Eliminar</button></div>`).join('')}</div>`},

 return`<div class="card"><h3>Preparación: ${p.toFixed(0)}% <small>(${d} de ${n} tareas)</small></h3>${bar(0).replace('width:0%','width:'+p+'%')}</div><br><div class="card"><h3>Plantillas de equipaje</h3><div class="row">${Object.entries(TPL).map(([k,v])=>`<button class="btn s" onclick="addTpl('${k}')">+ ${v[0]}</button>`).join('')}</div><small class="mu">Las tareas se agregan con fecha límite 2 días antes del viaje.</small></div><br><div class="card"><form onsubmit="return addT(event)" class="f"><div class="full"><label>Nueva tarea</label><input name="t" required maxlength="120"></div><div><label>Categoría</label><select name="c">${TC.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Fecha límite</label><input name="due" type="date"></div><div style="align-self:end"><button class="btn p">Agregar tarea</button></div></form></div><br>

data(){return`<div class="card"><h3>Viaje y datos</h3><div class="row"><button class="btn p" onclick="openTrip()">Configurar viaje</button><button class="btn" onclick="expJ()">Exportar JSON</button><label class="btn" style="margin:0;color:var(--tx)">Importar JSON<input type="file" accept=".json" hidden onchange="imp(this)"></label><button class="btn" onclick="expC()">Exportar itinerario (CSV)</button><button class="btn" onclick="prt()">Imprimir itinerario</button><button class="btn d" onclick="reset()">Borrar todo</button></div><p class="mu">Los datos se guardan automáticamente en este navegador. Exporta un JSON para respaldo.</p></div>`}};

V.stg=()=>{if(!isD(S.trip.start))return empty();const t=S.trip;return`<div class="card"><h3>Nueva etapa</h3><form onsubmit="return addS(event)" class="f"><div><label>Ciudad o destino</label><input name="city" required maxlength="60"></div><div><label>Desde</label><input name="start" type="date" required min="${t.start}" max="${t.end}"></div><div><label>Hasta</label><input name="end" type="date" required min="${t.start}" max="${t.end}"></div><div><label>Alojamiento</label><input name="lodg" maxlength="80"></div><div class="full"><label>Dirección o notas</label><input name="addr" maxlength="120"></div><div style="align-self:end"><button class="btn p">Agregar etapa</button></div></form></div><br>${S.stages.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(s=>`<div class="card" style="margin-bottom:10px"><h3>${esc(s.city)} <small>${dl(s.start)} a ${dl(s.end)} · ${Math.round((pd(s.end)-pd(s.start))/864e5)} noches</small></h3>${s.lodg?`<p>Alojamiento: <b>${esc(s.lodg)}</b><br><span class="mu">Check-in ${dl(s.start)} · Check-out ${dl(s.end)} ${esc(s.addr)}</span></p>`:'<p class="mu">Sin alojamiento registrado.</p>'}<div class="row">${s.lodg?`<button class="btn s" onclick="mkLodg('${s.id}')">Crear actividad de alojamiento</button>`:''}<button class="btn s d" onclick="delS('${s.id}')">Eliminar</button></div></div>`).join('')||'<p class="mu">Aún no hay etapas. Agrega la primera ciudad de tu viaje.</p>'}`};
const stOf=d=>S.stages.find(s=>s.start<=d&&d<=s.end);
const dayCol=d=>['#ff9e6b','#6fd6a5','#7c9cff','#ffd27a','#c78bff','#ff6fa8','#4cc9b0','#ff6b7a'][Math.max(0,days().indexOf(d))%8];
const hav=(a,b)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(b.lat-a.lat)/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(r(b.lng-a.lng)/2)**2;return 12742*Math.asin(Math.sqrt(h))*1.3};
const leg=(a,b)=>{if(a.lat==null||b.lat==null)return'';const k=hav(a,b);return`<div class="mu" style="padding:4px 0 4px 20px">↓ ≈ ${k.toFixed(k<10?1:0)} km · ~${Math.max(1,Math.round(k/40*60))} min en auto (estimado)</div>`};
function addS(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),t=S.trip;if(!isD(f.start)||!isD(f.end)||f.end<f.start||f.start<t.start||f.end>t.end){toast('Las fechas deben estar dentro del viaje y el fin no puede ser anterior al inicio');return false}S.stages.push({id:uid(),city:f.city.trim(),start:f.start,end:f.end,lodg:f.lodg.trim(),addr:f.addr.trim()});render();toast('Etapa agregada');return false}
function delS(id){if(confirm('¿Eliminar esta etapa? Las actividades no se borran.')){S.stages=S.stages.filter(s=>s.id!==id);render()}}
function mkLodg(id){const s=S.stages.find(x=>x.id===id),n='Alojamiento: '+s.lodg;if(S.acts.some(a=>a.name===n&&a.sd===s.start)){toast('Esa actividad ya existe');return}S.acts.push({id:uid(),name:n,cat:'alojamiento',sd:s.start,st:'',ed:s.end,et:'',loc:s.addr||s.city,lat:null,lng:null,est:0,paid:'',status:'pendiente',notes:'Etapa: '+s.city});render();toast('Actividad creada; edítala para agregar el precio')}
function moveA(id,d){const a=S.acts.find(x=>x.id===id);if(!a)return;if(!d){a.sd=a.ed='';toast('Actividad sin fecha: quedó en «Ideas por definir»')}else{if(!days().includes(d))return;const k=a.sd&&a.ed?Math.round((pd(a.ed)-pd(a.sd))/864e5):0,e=pd(d);e.setDate(e.getDate()+k);a.sd=d;a.ed=iso(e);U.day=d;toast('Actividad movida al '+dl(d))}render()}

function render(){$('#ttl').textContent=S.trip.name||'Planificador de vacaciones';$('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k===U.tab?'on':''}" onclick="go('${k}')">${v}</button>`).join('');$('#main').innerHTML=(U.tab==='dash'?remB():'')+V[U.tab]();if(U.tab==='map')initMap();save()}
function setT(k,v){if(k!=='cur'){v=+v;if(!(v>=0)){toast('Ingresa un monto válido (0 o mayor)');return render()}}S.trip[k]=v;render()}
function mv(k,d){const o=S.dash.order,i=o.indexOf(k),j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];render()}
function hideW(k){S.dash.hide.push(k);render()}function showW(k){S.dash.hide=S.dash.hide.filter(x=>x!==k);render()}
const dlg=h=>{$('#dlg').innerHTML=h;if(!$('#dlg').open)$('#dlg').showModal()};const cls=()=>$('#dlg').close();
function openTrip(){const t=S.trip;dlg(`<h3>Configurar viaje</h3><form onsubmit="return saveTrip(event)"><div class="f"><div class="full"><label>Nombre del viaje</label><input name="name" required value="${esc(t.name)}"></div><div><label>Destino</label><input name="dest" value="${esc(t.dest)}"></div><div><label>Moneda</label><select name="cur">${['CLP','USD','EUR','ARS','BRL','PEN','MXN','BOB'].map(c=>`<option ${c===t.cur?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Inicio</label><input name="start" type="date" required value="${t.start}"></div><div><label>Término</label><input name="end" type="date" required value="${t.end}"></div><div><label>Presupuesto total</label><input name="budget" type="number" min="0" value="${t.budget}"></div><div><label>Límite diario</label><input name="limit" type="number" min="0" value="${t.limit}"></div></div><p id="err" class="r"></p><div class="row"><span class="g"></span><button type="button" class="btn" onclick="cls()">Cancelar</button><button class="btn p">Guardar</button></div></form>`)}
function saveTrip(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),er=m=>($('#err').textContent=m,false);
 if(!isD(f.start)||!isD(f.end))return er('Fechas no válidas.');if(f.end<f.start)return er('El término no puede ser anterior al inicio.');if((pd(f.end)-pd(f.start))/864e5>90)return er('El viaje no puede superar 90 días.');
 if(!(+f.budget>=0)||!(+f.limit>=0))return er('Los montos no pueden ser negativos.');
 const out=S.acts.filter(a=>a.sd&&(a.sd<f.start||a.sd>f.end)).length;if(out)return er(`Hay ${out} actividad(es) fuera de estas fechas. Edítalas o elimínalas primero.`);
 S.trip=Object.assign(S.trip,{name:f.name.trim(),dest:f.dest.trim(),cur:f.cur,start:f.start,end:f.end,budget:+f.budget,limit:+f.limit});U.day=null;cls();render();toast('Viaje guardado');return false}
function openAct(id,d){if(!isD(S.trip.start)){toast('Configura primero las fechas del viaje');return openTrip()}
 const a=S.acts.find(x=>x.id===id)||{name:'',cat:'turismo',sd:d||U.day||S.trip.start,st:'',ed:d||U.day||S.trip.start,et:'',loc:'',lat:'',lng:'',est:'',paid:'',status:'pendiente',notes:''};
 dlg(`<h3>${id?'Editar':'Nueva'} actividad</h3><form oninput="durU(this)" onsubmit="return saveAct(event,'${id||''}')"><div class="f"><div class="full"><label>Nombre</label><input name="name" required maxlength="100" value="${esc(a.name)}"></div><div><label>Categoría</label><select name="cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===a.cat?'selected':''}>${v[0]}</option>`).join('')}</select></div><div><label>Estado</label><select name="status" onchange="this.form.paid.disabled=this.value!=='pagado'">${Object.entries(STS).map(([k,v])=>`<option value="${k}" ${k===a.status?'selected':''}>${v}</option>`).join('')}</select></div>
 <div class="full"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="tbd" ${id&&!a.sd?'checked':''}> Por definir (sin fecha todavía)</label></div><div><label>Fecha inicio</label><input name="sd" type="date" value="${a.sd}"></div><div><label>Hora inicio</label><input name="st" type="time" value="${a.st}"></div><div><label>Fecha término</label><input name="ed" type="date" value="${a.ed}"></div><div><label>Hora término</label><input name="et" type="time" value="${a.et}"></div><div class="full"><small class="mu">Duración: <span id="du">${a.sd&&a.st&&a.et?dur(a):'—'}</span></small></div>
 <div class="full"><label>Ubicación / destino</label><div class="row"><input name="loc" style="flex:1" value="${esc(a.loc)}"><button type="button" class="btn" onclick="geo(this.form)">Buscar ubicación</button></div></div><div><label>Latitud</label><input name="lat" type="number" step="any" value="${a.lat??''}"></div><div><label>Longitud</label><input name="lng" type="number" step="any" value="${a.lng??''}"></div>
 <div><label>Moneda</label><select name="cur">${[S.trip.cur,...CUR.filter(c=>c!==S.trip.cur)].map(c=>`<option ${c===(a.cur||S.trip.cur)?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Precio estimado</label><input name="est" type="number" min="0" step="any" value="${a.cur?a.oest:a.est}"></div><div><label>Precio pagado</label><input name="paid" type="number" min="0" step="any" value="${a.cur?a.opaid:a.paid}" ${a.status==='pagado'?'':'disabled'}></div><div><label>Código de confirmación</label><input name="code" maxlength="40" value="${esc(a.code||'')}"></div><div><label>Enlace (ticket, PDF, reserva)</label><input name="link" type="url" placeholder="https://" value="${esc(a.link||'')}"></div><div class="full"><label>Vuelo, aeropuerto o terminal</label><input name="ap" maxlength="100" value="${esc(a.ap||'')}"></div><div class="full"><label>Comentarios</label><textarea name="notes" rows="2">${esc(a.notes)}</textarea></div></div><p id="err" class="r"></p><div class="row"><span class="g"></span><button type="button" class="btn" onclick="cls()">Cancelar</button><button class="btn p">Guardar</button></div></form>`)}
function durU(f){const v=Object.fromEntries(new FormData(f));$('#du').textContent=v.sd&&(v.ed||v.sd)&&v.st&&v.et?dur({sd:v.sd,st:v.st,ed:v.ed||v.sd,et:v.et}):'—'}
async function geo(f){const q=f.loc.value.trim();if(!q)return toast('Escribe una ubicación');try{const r=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q))).json();if(!r.length)return toast('No se encontró la ubicación');f.lat.value=(+r[0].lat).toFixed(5);f.lng.value=(+r[0].lon).toFixed(5);toast('Ubicación encontrada')}catch(e){toast('Sin conexión para buscar ubicación')}}
function saveAct(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),er=m=>($('#err').textContent=m,false),D=days();
 f.name=f.name.trim();if(!f.name)return er('Ingresa un nombre.');if(!f.tbd&&(!isD(f.sd)||f.sd<D[0]||f.sd>D[D.length-1]))return er('La fecha de inicio debe estar dentro de las fechas del viaje.');
 if(f.tbd)f.sd=f.ed='';else{f.ed=f.ed||f.sd;if(!isD(f.ed)||f.ed<f.sd)return er('La fecha de término no puede ser anterior al inicio.')}if(f.ed===f.sd&&f.st&&f.et&&f.et<=f.st)return er('La hora de término debe ser posterior a la de inicio.');
 if(f.et&&!f.st)return er('Indica la hora de inicio.');if(f.link&&!/^https?:\/\//i.test(f.link))return er('El enlace debe comenzar con http:// o https://');
 f.est=f.est===''?0:+f.est;if(!(f.est>=0))return er('El precio estimado no es válido.');
 if(f.status==='pagado'){f.paid=f.paid===''?f.est:+f.paid;if(!(f.paid>0))return er('Indica el monto pagado.')}else f.paid='';
 const la=f.lat===''?null:+f.lat,ln=f.lng===''?null:+f.lng;if((la===null)!==(ln===null)||(la!==null&&(Math.abs(la)>90||Math.abs(ln)>180)))return er('Coordenadas no válidas.');f.lat=la;f.lng=ln;if(f.cur&&f.cur!==S.trip.cur){const r=+S.rates[f.cur];if(!r)return er('Define el tipo de cambio de '+f.cur+' en la pestaña Compartidos.');f.oest=f.est;f.opaid=f.paid;f.est=Math.round(f.est*r*100)/100;if(f.paid!=='')f.paid=Math.round(f.paid*r*100)/100}else{f.cur='';f.oest=f.opaid=undefined}
 if(id)Object.assign(S.acts.find(a=>a.id===id),f);else S.acts.push({id:uid(),...f});U.day=f.sd||U.day;cls();render();toast('Actividad guardada');return false}
function openDet(id){const a=S.acts.find(x=>x.id===id);if(!a)return;cls();dlg(`<h3><span class="dot" style="display:inline-block;background:${CATS[a.cat][1]}"></span> ${esc(a.name)}</h3><p>${badge(a.status)} ${CATS[a.cat][0]}</p><p>${a.sd?`Inicio: ${dl(a.sd)} ${a.st||''}<br>Término: ${dl(a.ed)} ${a.et||''}<br>Duración: ${a.st&&a.et?dur(a):'—'}`:'Fecha: por definir'}</p>${a.loc?`<p>Ubicación: ${esc(a.loc)}</p>`:''}${a.ap?`<p>Vuelo / terminal: ${esc(a.ap)}</p>`:''}${a.code?`<p>Confirmación: <b>${esc(a.code)}</b></p>`:''}${a.link&&/^https?:\/\//i.test(a.link)?`<p><a href="${esc(a.link)}" target="_blank" rel="noopener" style="color:var(--ac)">Abrir enlace de la reserva</a></p>`:''}<p>Estimado: ${fmt(a.est)}${a.status==='pagado'?`<br>Pagado: ${fmt(a.paid)}`:''}</p>${a.notes?`<p class="mu">${esc(a.notes)}</p>`:''}<p><select onchange="moveA('${a.id}',this.value);cls()"><option value="" disabled selected>Mover a…</option>${days().map((d,i)=>`<option value="${d}">Día ${i+1} · ${dl(d)}</option>`).join('')}<option value="">Por definir (sin fecha)</option></select></p><div class="row"><button class="btn" onclick="openAct('${a.id}')">Editar</button><button class="btn" onclick="dup('${a.id}')">Duplicar</button><button class="btn d" onclick="delA('${a.id}')">Eliminar</button><span class="g"></span><button class="btn" onclick="cls()">Cerrar</button></div>`)}

async function addW(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),w={id:uid(),name:f.name.trim(),loc:f.loc.trim(),lat:null,lng:null};if(!w.name)return false;if(w.loc){try{const r=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(w.loc))).json();if(r.length){w.lat=+r[0].lat;w.lng=+r[0].lon}else toast('No se encontró la ubicación; se guardó sin mapa')}catch(x){toast('Sin conexión; se guardó sin ubicación')}}S.wish.push(w);render();return false}

const obj=(k,id)=>(k==='a'?S.acts:S.extras).find(x=>x.id===id);
function bal(){let n=0;expl().filter(x=>x.sh==='split').forEach(x=>n+=(x.py==='otro'?-1:1)*x.m/2);return n-S.settled.reduce((s,x)=>s+x.m,0)}
V.sh=()=>{const p=S.partner||'tu acompañante',b=bal(),L=expl();
return`<div class="card"><h3>Acompañante y monedas</h3><div class="f"><div><label>Nombre de la otra persona</label><input value="${esc(S.partner)}" maxlength="40" onchange="S.partner=this.value.trim();render()"></div></div><form onsubmit="return addR(event)" class="row" style="margin-top:10px"><span>1</span><select name="c" style="width:90px">${CUR.filter(c=>c!==S.trip.cur).map(c=>`<option>${c}</option>`).join('')}</select><span>=</span><input name="r" type="number" min="0" step="any" required style="width:110px"><span>${S.trip.cur}</span><button class="btn">Guardar tipo de cambio</button></form>${Object.entries(S.rates).map(([c,r])=>`<div class="it"><div style="flex:1">1 ${c} = ${r} ${S.trip.cur}</div><button class="btn s d" onclick="delR('${c}')">Quitar</button></div>`).join('')}</div><br>
<div class="card"><h3>Saldo</h3><p style="font-size:18px"><b>${Math.abs(b)<1?'Están a mano':b>0?esc(p)+' te debe '+fmt(b):'Debes a '+esc(p)+' '+fmt(-b)}</b></p><small class="mu">Los gastos repartidos se dividen 50/50.</small>${Math.abs(b)>=1?`<div style="margin-top:8px"><button class="btn p" onclick="settle()">Registrar liquidación (saldar)</button></div>`:''}</div><br>
<div class="card"><h3>Gastos pagados</h3>${L.length?L.map(x=>`<div class="it"><div style="flex:1;min-width:150px"><b>${esc(x.n)}</b><div class="mu">${x.d?dl(x.d):''}${x.o?' · original '+esc(x.o):''}</div></div><b>${fmt(x.m)}</b><select style="width:auto" onchange="setSh('${x.k}','${x.id}',this.value)"><option value="mine">Por mi cuenta</option><option value="split" ${x.sh==='split'?'selected':''}>Repartido</option></select>${x.sh==='split'?`<select style="width:auto" onchange="setPy('${x.k}','${x.id}',this.value)"><option value="yo">Pagué yo</option><option value="otro" ${x.py==='otro'?'selected':''}>Pagó ${esc(p)}</option></select>`:''}<button class="btn s" onclick="${x.rc?`viewR('${x.rc}','${x.k}','${x.id}')`:`pickR('${x.k}','${x.id}')`}">${x.rc?'Ver boleta':'📷 Boleta'}</button></div>`).join(''):'<p class="mu">Aquí aparecen las actividades pagadas y los gastos adicionales.</p>'}</div>`};
function addR(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!(+f.r>0))return false;S.rates[f.c]=+f.r;render();return false}
function delR(c){delete S.rates[c];render()}
function settle(){const b=bal();if(Math.abs(b)<1)return;S.settled.push({d:iso(new Date()),m:b});render();toast('Liquidación registrada')}
function setSh(k,id,v){const o=obj(k,id);if(!o)return;o.sh=v==='split'?'split':'mine';if(v==='split'&&!o.py)o.py='yo';render()}

function pickR(k,id){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const q=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*q;c.height=im.height*q;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);saveR(k,id,c.toDataURL('image/jpeg',.5))};im.onerror=()=>toast('No se pudo leer la imagen');im.src=u};i.click()}

r.daily.time.forEach((d,i)=>WX[d]={c:r.daily.weather_code[i],hi:r.daily.temperature_2m_max[i],lo:r.daily.temperature_2m_min[i],pp:r.daily.precipitation_probability_max[i]})}catch(e){}}
WXL=false;if(U.tab==='cal')render();toast(Object.keys(WX).length?'Clima actualizado':'Sin pronóstico disponible (fechas lejanas o sin conexión)')}
